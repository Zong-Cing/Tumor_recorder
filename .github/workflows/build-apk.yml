name: Build Android Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Test & Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug

      - name: Rename Debug APK with version
        id: version
        run: |
          VC=$(( GITHUB_RUN_NUMBER + 10 ))
          VN="1.0.${GITHUB_RUN_NUMBER}"
          OUT="app/build/outputs/apk/debug/TumorRecorder-v${VN}-vc${VC}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$OUT"
          echo "apk_path=$OUT" >> "$GITHUB_OUTPUT"
          echo "artifact_name=TumorRecorder-v${VN}-vc${VC}-debug-apk" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: ${{ steps.version.outputs.apk_path }}
          if-no-files-found: error
